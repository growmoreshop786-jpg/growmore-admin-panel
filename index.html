<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowMore Store - Web Control Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@aws-sdk/client-s3@3.379.0/dist/aws-sdk-client-s3.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Top Header -->
  <header class="bg-purple-950 text-white px-6 py-3 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="bg-purple-800 p-2 rounded-lg font-black text-sm">GM</div>
      <h1 class="text-lg font-bold">GrowMore</h1>
      <span class="text-xs text-purple-300 border-l border-purple-800 pl-3">Control Panel (R2 Connected)</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="openModal()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold text-xs shadow transition">
        + Add Product
      </button>
      <button onclick="openAddCategoryModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold text-xs shadow transition">
        + Add Collection
      </button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-60px)]">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-sm p-4 space-y-3">
      <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Store Catalog</div>
      <button onclick="switchTab('products')" id="tab-products" class="w-full text-left px-3 py-2.5 rounded-xl font-bold text-xs bg-purple-50 text-purple-900 flex justify-between">
        <span>📦 Products Catalog</span>
        <span id="sidebar-product-count" class="bg-purple-200 px-2 rounded-full text-[10px]">0</span>
      </button>
      <button onclick="switchTab('collections')" id="tab-collections" class="w-full text-left px-3 py-2.5 rounded-xl font-semibold text-xs text-gray-600 hover:bg-gray-50 flex justify-between">
        <span>🏷️ Collections & Pictures</span>
        <span id="sidebar-collection-count" class="bg-gray-100 px-2 rounded-full text-[10px]">0</span>
      </button>
    </aside>

    <!-- Main Section -->
    <main class="flex-1 p-6 space-y-6">
      <!-- Products Section -->
      <section id="section-products" class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-purple-950">Manage Products</h2>
        </div>
        <div id="admin-category-filters" class="flex flex-wrap gap-2 pb-2 border-b"></div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b text-[11px] font-bold text-gray-400 uppercase">
                <th class="pb-3 px-2">Image</th>
                <th class="pb-3 px-2">Title</th>
                <th class="pb-3 px-2">Category</th>
                <th class="pb-3 px-2">Price (Now / Was)</th>
                <th class="pb-3 px-2">Best Seller</th>
                <th class="pb-3 px-2 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="products-list" class="divide-y divide-gray-50">
              <tr><td colspan="6" class="p-6 text-center text-gray-400 text-xs">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Collections Section -->
      <section id="section-collections" class="hidden bg-white rounded-2xl shadow-sm border p-6 space-y-4">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold text-purple-950">Manage Collections & Background Pictures</h2>
            <p class="text-xs text-gray-400">Uploads directly to Cloudflare R2 bucket.</p>
          </div>
          <button onclick="openAddCategoryModal()" class="bg-purple-900 text-white px-4 py-2 rounded-xl font-bold text-xs">
            + New Collection
          </button>
        </div>
        <div id="collections-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div id="product-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-xl">
      <h3 id="modal-title" class="text-xl font-bold text-purple-950 mb-4">Add Product</h3>
      <form id="product-form-element" onsubmit="saveProduct(event)" class="space-y-3">
        <input type="hidden" id="product-id">
        <div>
          <label class="text-xs font-semibold block mb-1">Product Cover Image (Select File)</label>
          <input type="file" id="product-image" accept="image/*" class="w-full border p-2 rounded-lg text-xs">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold">Title</label>
            <input type="text" id="title" required class="w-full p-2 border rounded-lg text-xs">
          </div>
          <div>
            <label class="text-xs font-semibold">Category</label>
            <select id="category-select" class="w-full p-2 border rounded-lg text-xs"></select>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-xs font-semibold">Now Price (PKR)</label>
            <input type="number" id="price" required class="w-full p-2 border rounded-lg text-xs" placeholder="e.g 2000">
          </div>
          <div>
            <label class="text-xs font-semibold">Was Price (Old)</label>
            <input type="number" id="old-price" class="w-full p-2 border rounded-lg text-xs" placeholder="e.g 2500">
          </div>
          <div>
            <label class="text-xs font-semibold">Rating</label>
            <input type="text" id="rating" value="4.8" class="w-full p-2 border rounded-lg text-xs">
          </div>
        </div>
        <div class="flex items-center space-x-2 pt-2">
          <input type="checkbox" id="is-best-seller" class="w-4 h-4 accent-purple-900">
          <label class="text-xs font-bold text-purple-950">Show in Best Sellers 🌟</label>
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs bg-gray-200 rounded-lg">Cancel</button>
          <button type="submit" id="save-product-btn" class="px-4 py-2 text-xs bg-purple-900 text-white font-bold rounded-lg">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Collection Modal -->
  <div id="category-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
      <h3 class="text-lg font-bold text-purple-950 mb-3">Add Collection</h3>
      <form onsubmit="saveNewCategory(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold block mb-1">Collection Name</label>
          <input type="text" id="new-category-name" required class="w-full p-2 border rounded-lg text-xs" placeholder="e.g Earbuds">
        </div>
        <div>
          <label class="text-xs font-semibold block mb-1">Background Picture</label>
          <input type="file" id="new-category-image" accept="image/*" class="w-full border p-2 rounded-lg text-xs">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeCategoryModal()" class="px-3 py-1.5 text-xs bg-gray-200 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-1.5 text-xs bg-purple-900 text-white font-semibold rounded-lg">Save Collection</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://expcwtfedhjmbhsnslkf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B_0j8EGmc1a76LhW-GfjPw_3ff1KmK7';
    let dbClient;

    // --- CLOUDFLARE R2 CREDENTIALS (INCORPORATED) ---
    const R2_ACCOUNT_ID = '7a4d159847cdc2e37acbb1309c';
    const R2_ACCESS_KEY_ID = '6c0d348deb8a321e782871652ef3c752';
    const R2_SECRET_ACCESS_KEY = '6b5e5a469deed56b4bd69c74a48c8bc0570a0cf617df96e9c947c0e8e418620d';
    const R2_BUCKET_NAME = 'growmoreapp';
    const R2_PUBLIC_DOMAIN = 'https://pub-383f618e59654bcfa5acf2d19b5355ce.r2.dev';

    let s3Client;
    let allProducts = [];
    let selectedAdminCategory = 'All';
    let collectionsList = [
      { name: 'Earbuds', image: '' },
      { name: 'Power Bank', image: '' },
      { name: 'Mobile Chargers', image: '' },
      { name: 'Car Chargers', image: '' },
      { name: 'Handfree', image: '' },
      { name: 'Speakers', image: '' },
      { name: 'Headphone', image: '' },
      { name: 'Neckbands', image: '' }
    ];

    window.onload = async () => {
      dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      // Initialize S3 Client for Cloudflare R2
      s3Client = new aws.S3Client({
        region: 'auto',
        endpoint: `https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
        credentials: {
          accessKeyId: R2_ACCESS_KEY_ID,
          secretAccessKey: R2_SECRET_ACCESS_KEY
        }
      });

      await loadCollectionsFromSupabase();
      await loadProducts();
    };

    // Upload directly to Cloudflare R2 Bucket
    async function uploadToCloudflareR2(file, folder) {
      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${folder}/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        const uploadCommand = new aws.PutObjectCommand({
          Bucket: R2_BUCKET_NAME,
          Key: fileName,
          Body: uint8Array,
          ContentType: file.type,
        });

        await s3Client.send(uploadCommand);
        return `${R2_PUBLIC_DOMAIN}/${fileName}`;
      } catch (e) {
        throw new Error('R2 Upload Failed: ' + e.message);
      }
    }

    async function loadCollectionsFromSupabase() {
      try {
        const { data } = await dbClient.from('settings').select('value').eq('key', 'collections').maybeSingle();
        if (data && data.value) {
          collectionsList = JSON.parse(data.value);
        }
      } catch (e) {}

      document.getElementById('sidebar-collection-count').innerText = collectionsList.length;
      renderCategoryDropdown();
      renderCategoryFilters();
      renderCollectionsAdminGrid();
    }

    function renderCategoryDropdown() {
      const select = document.getElementById('category-select');
      select.innerHTML = collectionsList.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    }

    function renderCategoryFilters() {
      const container = document.getElementById('admin-category-filters');
      container.innerHTML = `
        <button onclick="filterAdminCategory('All')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${selectedAdminCategory === 'All' ? 'bg-purple-900 text-white' : 'bg-gray-100 text-purple-900'}">
          All
        </button>
      ` + collectionsList.map(c => `
        <button onclick="filterAdminCategory('${c.name}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${selectedAdminCategory === c.name ? 'bg-purple-900 text-white' : 'bg-gray-100 text-purple-900'}">
          ${c.name}
        </button>
      `).join('');
    }

    function filterAdminCategory(cat) {
      selectedAdminCategory = cat;
      renderCategoryFilters();
      displayProducts();
    }

    function renderCollectionsAdminGrid() {
      const grid = document.getElementById('collections-grid');
      grid.innerHTML = collectionsList.map((c, index) => `
        <div class="bg-white p-4 rounded-xl shadow-sm border flex items-center space-x-3">
          <div class="w-14 h-14 rounded-lg bg-gray-100 border overflow-hidden flex-shrink-0 flex items-center justify-center">
            ${c.image ? `<img src="${c.image}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-gray-400">No Pic</span>`}
          </div>
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-purple-950 text-xs truncate">${c.name}</h4>
            <label class="text-[10px] text-blue-600 font-bold cursor-pointer hover:underline">
              📁 Change Pic <input type="file" accept="image/*" class="hidden" onchange="uploadCollectionPicDirect(event, ${index})">
            </label>
          </div>
          <button onclick="deleteCollection(${index})" class="text-red-500 font-bold text-xs p-2">🗑️</button>
        </div>
      `).join('');
    }

    async function uploadCollectionPicDirect(event, index) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const publicUrl = await uploadToCloudflareR2(file, 'collection_image');
        collectionsList[index].image = publicUrl;
        await dbClient.from('settings').upsert({ key: 'collections', value: JSON.stringify(collectionsList) });
        renderCollectionsAdminGrid();
        alert('Collection Picture Uploaded to R2! ✅');
      } catch (e) {
        alert('Upload Error: ' + e.message);
      }
    }

    async function saveNewCategory(e) {
      e.preventDefault();
      const name = document.getElementById('new-category-name').value.trim();
      const file = document.getElementById('new-category-image').files[0];
      let imgUrl = '';

      if (file) {
        try { imgUrl = await uploadToCloudflareR2(file, 'collection_image'); } catch(err){ alert(err.message); return; }
      }

      if (name) {
        collectionsList.push({ name, image: imgUrl });
        await dbClient.from('settings').upsert({ key: 'collections', value: JSON.stringify(collectionsList) });
        await loadCollectionsFromSupabase();
      }
      closeCategoryModal();
    }

    async function deleteCollection(index) {
      if (confirm('Delete this collection?')) {
        collectionsList.splice(index, 1);
        await dbClient.from('settings').upsert({ key: 'collections', value: JSON.stringify(collectionsList) });
        loadCollectionsFromSupabase();
      }
    }

    async function loadProducts() {
      try {
        const { data, error } = await dbClient.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;
        allProducts = data || [];
        document.getElementById('sidebar-product-count').innerText = allProducts.length;
        displayProducts();
      } catch(err) {
        console.error("Load products error:", err);
      }
    }

    function displayProducts() {
      const container = document.getElementById('products-list');
      let filtered = allProducts;
      if (selectedAdminCategory !== 'All') {
        filtered = allProducts.filter(p => p.category?.toLowerCase() === selectedAdminCategory.toLowerCase());
      }

      if (!filtered.length) {
        container.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400 text-xs">No products found.</td></tr>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <tr class="text-xs border-b">
          <td class="py-2 px-2"><img src="${p.image_url || ''}" class="w-9 h-9 object-cover rounded border" onerror="this.src='https://via.placeholder.com/40?text=Img'"></td>
          <td class="py-2 px-2 font-bold">${p.title}</td>
          <td class="py-2 px-2"><span class="bg-purple-100 text-purple-900 px-2 py-0.5 rounded-full text-[10px]">${p.category}</span></td>
          <td class="py-2 px-2">
            <div class="font-bold text-purple-950">Now: PKR ${p.price}</div>
            ${p.old_price ? `<div class="text-[10px] text-gray-400 line-through">Was: PKR ${p.old_price}</div>` : ''}
          </td>
          <td class="py-2 px-2">${p.is_best_seller ? '🌟 Yes' : 'No'}</td>
          <td class="py-2 px-2 text-right space-x-2">
            <button onclick="editProduct(${p.id})" class="text-blue-600 font-bold hover:underline">Edit</button>
            <button onclick="deleteProduct(${p.id})" class="text-red-600 font-bold hover:underline">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function saveProduct(event) {
      event.preventDefault();
      const btn = document.getElementById('save-product-btn');
      btn.innerText = "Uploading to R2... ⏳";
      btn.disabled = true;

      try {
        const id = document.getElementById('product-id').value;
        const title = document.getElementById('title').value.trim();
        const category = document.getElementById('category-select').value;
        const price = parseFloat(document.getElementById('price').value);
        const oldPrice = document.getElementById('old-price').value ? parseFloat(document.getElementById('old-price').value) : null;
        const rating = parseFloat(document.getElementById('rating').value) || 4.8;
        const isBestSeller = document.getElementById('is-best-seller').checked;
        const file = document.getElementById('product-image').files[0];

        let existingProduct = id ? allProducts.find(p => p.id == id) : null;
        let imageUrl = existingProduct ? existingProduct.image_url : '';

        if (file) {
          imageUrl = await uploadToCloudflareR2(file, 'products_image');
        }

        const productData = { 
          title, 
          category, 
          price, 
          old_price: oldPrice,
          rating, 
          is_best_seller: isBestSeller, 
          image_url: imageUrl 
        };

        let error;
        if (id) {
          const res = await dbClient.from('products').update(productData).eq('id', id);
          error = res.error;
        } else {
          const res = await dbClient.from('products').insert([productData]);
          error = res.error;
        }

        if (error) throw error;

        alert('Product Saved with R2 Image! ✅');
        closeModal();
        loadProducts();
      } catch (e) {
        alert('Error saving product: ' + e.message);
      } finally {
        btn.innerText = "Save Product";
        btn.disabled = false;
      }
    }

    function editProduct(id) {
      const p = allProducts.all ? allProducts.find(item => item.id == id) : allProducts.find(item => item.id == id);
      if (!p) return;
      document.getElementById('product-id').value = p.id;
      document.getElementById('title').value = p.title || '';
      document.getElementById('category-select').value = p.category || '';
      document.getElementById('price').value = p.price || '';
      document.getElementById('old-price').value = p.old_price || '';
      document.getElementById('rating').value = p.rating || 4.8;
      document.getElementById('is-best-seller').checked = p.is_best_seller === true;
      document.getElementById('product-image').value = '';

      document.getElementById('modal-title').innerText = 'Edit Product';
      document.getElementById('product-modal').classList.remove('hidden');
    }

    async function deleteProduct(id) {
      if (confirm('Delete Product?')) {
        const { error } = await dbClient.from('products').delete().eq('id', id);
        if (error) {
          alert('Delete error: ' + error.message);
        } else {
          loadProducts();
        }
      }
    }

    function switchTab(tab) {
      document.getElementById('section-products').classList.toggle('hidden', tab !== 'products');
      document.getElementById('section-collections').classList.toggle('hidden', tab !== 'collections');
      
      document.getElementById('tab-products').className = tab === 'products' ? 'w-full text-left px-3 py-2.5 rounded-xl font-bold text-xs bg-purple-50 text-purple-900 flex justify-between' : 'w-full text-left px-3 py-2.5 rounded-xl font-semibold text-xs text-gray-600 hover:bg-gray-50 flex justify-between';
      document.getElementById('tab-collections').className = tab === 'collections' ? 'w-full text-left px-3 py-2.5 rounded-xl font-bold text-xs bg-purple-50 text-purple-900 flex justify-between' : 'w-full text-left px-3 py-2.5 rounded-xl font-semibold text-xs text-gray-600 hover:bg-gray-50 flex justify-between';
    }

    function openModal() { 
      document.getElementById('product-form-element').reset();
      document.getElementById('product-id').value = '';
      document.getElementById('modal-title').innerText = 'Add Product';
      document.getElementById('product-modal').classList.remove('hidden'); 
    }
    function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }
    function openAddCategoryModal() { document.getElementById('category-modal').classList.remove('hidden'); }
    function closeCategoryModal() { document.getElementById('category-modal').classList.add('hidden'); }
  </script>
</body>
</html>
